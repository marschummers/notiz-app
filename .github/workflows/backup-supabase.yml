name: Backup Supabase to Google Drive

on:
  schedule:
    # Taeglich nachts. GitHub-Zeitplaene verwenden UTC.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
      SUPABASE_STORAGE_BACKUP_EMAIL: ${{ secrets.SUPABASE_STORAGE_BACKUP_EMAIL }}
      SUPABASE_STORAGE_BACKUP_PASSWORD: ${{ secrets.SUPABASE_STORAGE_BACKUP_PASSWORD }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_URL: https://ielieyybudoyicedztct.supabase.co

    steps:
      - uses: actions/checkout@v4

      - name: Install backup tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes rclone

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_DB_URL" || { echo 'SUPABASE_DB_URL is missing'; exit 1; }
          test -n "$BACKUP_ENCRYPTION_PASSWORD" || { echo 'BACKUP_ENCRYPTION_PASSWORD is missing'; exit 1; }
          test -n "$SUPABASE_STORAGE_BACKUP_EMAIL" || { echo 'SUPABASE_STORAGE_BACKUP_EMAIL is missing'; exit 1; }
          test -n "$SUPABASE_STORAGE_BACKUP_PASSWORD" || { echo 'SUPABASE_STORAGE_BACKUP_PASSWORD is missing'; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo 'VITE_SUPABASE_ANON_KEY is missing'; exit 1; }
          test -n "${{ secrets.RCLONE_CONFIG_B64 }}" || { echo 'RCLONE_CONFIG_B64 is missing'; exit 1; }

      - name: Export database
        shell: bash
        run: |
          mkdir -p backup/plain
          docker run --rm \
            -e DATABASE_URL="$SUPABASE_DB_URL" \
            -v "$PWD/backup/plain:/backup" \
            postgres:17-alpine \
            sh -c 'pg_dump "$DATABASE_URL" --schema=public --format=custom --no-owner --no-privileges --file=/backup/database.dump'

      - name: Validate database dump
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD/backup/plain:/backup" \
            postgres:17-alpine \
            pg_restore --list /backup/database.dump > backup/plain/manifest.txt
          test -s backup/plain/manifest.txt

      - name: Download PDF storage with read-only user
        shell: bash
        run: |
          STORAGE_BACKUP_OUTPUT="$PWD/backup/plain/storage/notiz-pdfs" \
            node .github/scripts/backup-storage.mjs

          (
            cd backup/plain
            find storage -type f -print0 \
              | sort --zero-terminated \
              | xargs --null --no-run-if-empty sha256sum \
              > storage-files.sha256
          )

      - name: Encrypt backup
        id: archive
        shell: bash
        run: |
          timestamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          archive="workspace-supabase-${timestamp}.tar.gz.gpg"
          tar -C backup/plain -czf backup/database.tar.gz .
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$BACKUP_ENCRYPTION_PASSWORD" \
            --symmetric --cipher-algo AES256 \
            --output "backup/$archive" backup/database.tar.gz
          rm -rf backup/plain backup/database.tar.gz
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Configure Google Drive
        shell: bash
        run: |
          mkdir -p "$HOME/.config/rclone"
          echo '${{ secrets.RCLONE_CONFIG_B64 }}' | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Upload encrypted backup to Google Drive
        shell: bash
        run: |
          rclone copy "backup/${{ steps.archive.outputs.archive }}" \
            'workspace-backup:Workspace-App-Backups/daily'

      - name: Remove Google Drive backups older than 14 days
        shell: bash
        run: |
          rclone delete 'workspace-backup:Workspace-App-Backups/daily' --min-age 14d

      - name: Keep an encrypted GitHub copy
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.archive }}
          path: backup/${{ steps.archive.outputs.archive }}
          retention-days: 14
          if-no-files-found: error
