name: Backup Supabase to Google Drive

on:
  schedule:
    # Taeglich nachts. GitHub-Zeitplaene verwenden UTC.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install --yes rclone

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_DB_URL" || { echo 'SUPABASE_DB_URL is missing'; exit 1; }
          test -n "$BACKUP_ENCRYPTION_PASSWORD" || { echo 'BACKUP_ENCRYPTION_PASSWORD is missing'; exit 1; }
          test -n "${{ secrets.RCLONE_CONFIG_B64 }}" || { echo 'RCLONE_CONFIG_B64 is missing'; exit 1; }

      - name: Export database
        shell: bash
        run: |
          mkdir -p backup/plain
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/plain/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/plain/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/plain/data.sql --data-only --use-copy

      - name: Encrypt backup
        id: archive
        shell: bash
        run: |
          timestamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          archive="workspace-supabase-${timestamp}.tar.gz.gpg"
          tar -C backup/plain -czf backup/database.tar.gz roles.sql schema.sql data.sql
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$BACKUP_ENCRYPTION_PASSWORD" \
            --symmetric --cipher-algo AES256 \
            --output "backup/$archive" backup/database.tar.gz
          rm -rf backup/plain backup/database.tar.gz
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Configure Google Drive
        shell: bash
        run: |
          mkdir -p "$HOME/.config/rclone"
          echo '${{ secrets.RCLONE_CONFIG_B64 }}' | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Upload encrypted backup to Google Drive
        shell: bash
        run: |
          rclone copy "backup/${{ steps.archive.outputs.archive }}" \
            'workspace-backup:Workspace-App-Backups/daily'

      - name: Remove Google Drive backups older than 90 days
        shell: bash
        run: |
          rclone delete 'workspace-backup:Workspace-App-Backups/daily' --min-age 90d

      - name: Keep an encrypted GitHub copy
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.archive }}
          path: backup/${{ steps.archive.outputs.archive }}
          retention-days: 30
          if-no-files-found: error
