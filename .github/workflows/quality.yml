name: Code and migration safety

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prevent unsafe or rewritten migrations
        shell: bash
        run: |
          base=''
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            base='${{ github.event.pull_request.base.sha }}'
          elif [[ '${{ github.event_name }}' == 'push' ]]; then
            base='${{ github.event.before }}'
          fi
          if [[ -n "$base" && "$base" != '0000000000000000000000000000000000000000' ]]; then
            node .github/scripts/check-migration-safety.mjs --base "$base"
          else
            node .github/scripts/check-migration-safety.mjs
          fi
      - run: npm run lint
      - run: npm run build
